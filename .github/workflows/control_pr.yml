name: control_pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main
      - develop

permissions:
  issues: read
  pull-requests: read

jobs:
  control_pr:
    name: control_pr
    runs-on: ubuntu-latest
    steps:
      - name: Validar Issue de tarea definida
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');

          async function main() {
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const pullRequest = event.pull_request;
            const repository = process.env.GITHUB_REPOSITORY;
            const token = process.env.GITHUB_TOKEN;
            const references = [...new Set([...`${pullRequest.title}\n${pullRequest.body || ''}`.matchAll(/#(\d+)\b/g)].map((match) => Number(match[1])))];

            if (references.length === 0) {
              throw new Error('El título o la descripción debe referenciar un Issue con formato #123.');
            }

            const requiredSections = [
              'Objetivo del cambio',
              'Criterios de aceptación (checklist)',
              'Archivos o módulos permitidos a modificar',
              'Rama base destino',
            ];
            let matchingIssue;

            for (const issueNumber of references) {
              const response = await fetch(`https://api.github.com/repos/${repository}/issues/${issueNumber}`, {
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${token}`,
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              });

              if (response.status === 404) continue;
              if (!response.ok) {
                throw new Error(`No se pudo consultar el Issue #${issueNumber}: HTTP ${response.status}.`);
              }

              const issue = await response.json();
              if (issue.pull_request || issue.state !== 'open') continue;

              const sections = new Map(
                (issue.body || '').split(/^#{2,6} /m).slice(1).map((section) => {
                  const [heading, ...content] = section.split(/\r?\n/);
                  return [heading.trim(), content.join('\n').trim()];
                }),
              );
              const hasRequiredSections = requiredSections.every((section) => {
                const value = sections.get(section);
                return value && value !== '_No response_';
              });
              const acceptanceCriteria = sections.get('Criterios de aceptación (checklist)') || '';
              const hasChecklist = /^\s*[-*] \[[ xX]\] .+/m.test(acceptanceCriteria);
              const baseBranch = (sections.get('Rama base destino') || '').replace(/`/g, '').trim();
              const hasValidBaseBranch = ['main', 'develop'].includes(baseBranch);

              if (hasRequiredSections && hasChecklist && hasValidBaseBranch) {
                matchingIssue = issueNumber;
                break;
              }
            }

            if (!matchingIssue) {
              throw new Error('Ninguna referencia apunta a un Issue abierto y válido con los campos requeridos de tarea definida.');
            }

            console.log(`Issue de tarea definida validado: #${matchingIssue}.`);
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
